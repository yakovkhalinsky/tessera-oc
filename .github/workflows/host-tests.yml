name: host tests and device build

# The port's engine against the FM-1's baseline: the port must play exactly what
# the FM-1 plays. tools/build_host.sh generates the tables the engine reads and
# runs the shared generator test (vendor/tessera/tests/tessera_test.c) with the
# port's engine in place of the FM-1's.
#
# The device build compiles the same engine for the Teensy 4.0, so a change that
# only breaks on the target (a type, a section, a size) is caught here. The
# memory map is checked too: the v0.1.0 firmware bootlooped on the module
# because the engine's .pool was an orphan section, which no build noticed.

on:
  push:
  pull_request:

jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: build and run the host test
        run: tools/build_host.sh

  device:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: install PlatformIO
        run: pip install platformio
      - name: build for the Teensy 4.0
        run: pio run -e T40
      - name: the sizes
        run: pio run -e T40 -t size
      # The memory map: no orphan RAM and nothing outside the startup's reach.
      # The v0.1.0 firmware bootlooped on the module because the engine's .pool
      # was an orphan (nothing ever wrote it), and nothing in the build noticed.
      - name: the memory map
        run: python3 tools/check_sections.py .pio/build/T40/firmware.elf
