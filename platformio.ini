; SPDX-License-Identifier: GPL-3.0-only
; The o_C port's device build: a Teensy 4.0 in an o_C module (or an O_C-format
; Eurorack module with one).
;
;   pio run -e T40            build
;   pio run -e T40 -t upload  flash it (the module must be in normal mode)
;
; The engine's sources are the vendored Tessera's; the port's own are in
; firmware/. The engine is one unity unit (firmware/oc_engine.c), so the build
; compiles two translation units: that unit and the platform layer.

[platformio]
src_dir = firmware

[env]
platform = teensy
framework = arduino
build_flags =
  -DTEENSY_OPT_SMALLEST_CODE
  ; the module's USB MIDI in (the keys, the controllers) and the USB serial the
  ; crash report and the diagnostics go out on: the Teensy's own combined
  ; descriptor (one device, a MIDI port and a serial port)
  -DUSB_MIDI_SERIAL
  -Ifirmware
  -Ivendor/tessera/firmware/src
  -Ibuild/gen
  -w
extra_scripts = pre:tools/pio_tables.py
; the port has no audio path and no I2C: the Audio library and Wire are dead
; weight (and the Audio library's timing is not ours to keep)
lib_ignore = Audio, Wire
; the port's own sources are the project's source directory (the engine's are
; in the submodule and are pulled in by the unity unit, not compiled again)

[env:T40]
board = teensy40
; The toolchain is pinned: the port's memory map (firmware/oc_imxrt1062.ld) is
; the framework's own script with two deltas, and the MPU's trap (which the
; v0.1.1 fault was about) is the framework's own startup code. A framework
; that moves under the port's feet is a framework the port cannot check.
platform = teensy@6.0.0
platform_packages = framework-arduinoteensy@1.162.0
; the Teensy 4.0's rated speed. The clock the sequencer counts is the 24 MHz
; crystal, exact at either speed (600 = 24 x 25, 300 = 600 / 2), so the CPU
; clock is only headroom here.
board_build.f_cpu = 600000000
; The port's own memory map: the Teensy's, with the engine's .pool and .noinit
; inside .bss, so the startup clears them. The Teensy's own script orphans them
; (they land between the copied .data and the cleared .bss, and nothing ever
; writes them): that was the v0.1.0 bootloop. See firmware/oc_imxrt1062.ld.
board_build.ldscript = $PROJECT_DIR/firmware/oc_imxrt1062.ld
build_flags =
  ${env.build_flags}
  -DOC_VERSION_EXTRA="\"_T40\""
  ; the hardware variant: the o_C panel, revision A (mxmxmx, no VOR). The
  ; firmware refuses to build for a variant it does not know (oc_platform.cpp).
  -DOC_HW_UOC_A
